<button
  class="logo-replay"
  type="button"
  aria-label="Type Battle giriş animasyonunu yeniden oynat"
  (click)="replayIntro()"
>
  <span
    class="logo-canvas"
    [class.intro-active]="introActive"
    role="img"
    aria-label="Type Battle"
    [style.aspect-ratio]="canvas.width + ' / ' + canvas.height"
  >
    @for (sprite of keySprites; track sprite.name; let index = $index) {
      <img
        class="key-sprite"
        [class.bouncing]="bouncingSprites.has(sprite.name)"
        [src]="assetPath(sprite)"
        [attr.width]="sprite.w"
        [attr.height]="sprite.h"
        [style.left.%]="sprite.x0 / canvas.width * 100"
        [style.top.%]="sprite.y0 / canvas.height * 100"
        [style.width.%]="sprite.w / canvas.width * 100"
        [style.height.%]="sprite.h / canvas.height * 100"
        [style.--sprite-index]="index"
        decoding="async"
        draggable="false"
        alt=""
        (pointerenter)="onPointerEnter(sprite.name)"
        (pointerdown)="onPointerDown(sprite.name, $event)"
      />
    }

    @for (group of burstGroups; track group.name) {
      <span class="burst-group" aria-hidden="true">
        @for (sprite of group.sprites; track sprite.name; let index = $index) {
          <img
            class="burst-sprite"
            [src]="assetPath(sprite)"
            [attr.width]="sprite.w"
            [attr.height]="sprite.h"
            [style.left.%]="sprite.x0 / canvas.width * 100"
            [style.top.%]="sprite.y0 / canvas.height * 100"
            [style.width.%]="sprite.w / canvas.width * 100"
            [style.height.%]="sprite.h / canvas.height * 100"
            [style.transform-origin]="sprite.origin"
            [style.--sprite-index]="index"
            decoding="async"
            draggable="false"
            alt=""
            (animationend)="onBurstAnimationEnd($event, index)"
          />
        }
      </span>
    }
  </span>
</button>
