<section class="game-panel profile-panel" aria-labelledby="profile-title">
  <div class="profile-copy">
    <h2 id="profile-title" class="game-section-title">Profilini oluştur</h2>
    <p class="profile-intro">Yarışta görünecek oyuncu adını ve avatarını seç.</p>

    <div class="nickname-label">
      <label for="player-nickname">Oyuncu adı</label>
      <span class="nickname-count" aria-hidden="true">{{ nicknameCount() }} / {{ maxNicknameLength }}</span>
    </div>
    <input
      id="player-nickname"
      class="game-field"
      type="text"
      placeholder="Oyuncu adın"
      autocomplete="nickname"
      aria-describedby="nickname-hint"
      [attr.aria-invalid]="nicknameTooShort() || null"
      [value]="profile().nickname"
      (input)="updateNickname($event)"
      required
    />
    <p id="nickname-hint" aria-live="polite" aria-atomic="true" [class.has-error]="nicknameFeedback()">
      {{ nicknameFeedback() || defaultNicknameHint }}
    </p>
  </div>

  <fieldset>
    <legend>Avatarını seç</legend>
    <div class="avatar-grid">
      @for (avatar of avatars; track avatar.id) {
        <label class="avatar-option">
          <input
            type="radio"
            name="player-avatar"
            [value]="avatar.id"
            [attr.aria-label]="avatar.name"
            [checked]="profile().avatarId === avatar.id"
            (change)="selectAvatar(avatar.id)"
          />
          <span class="avatar-frame">
            <app-player-avatar [avatarId]="avatar.id" [decorative]="true" />
            <span class="avatar-check" aria-hidden="true">✓</span>
          </span>
        </label>
      }
    </div>
  </fieldset>
</section>
