services:
  app:
    build:
      context: .
      dockerfile: backend/TypingApp.Api/Dockerfile
    ports:
      - "5027:5027"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: Data Source=/data/typingapp.db
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    volumes:
      - db-data:/data

volumes:
  db-data:
