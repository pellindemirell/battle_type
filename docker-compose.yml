services:
  backend:
    build:
      context: ./backend/TypingApp.Api
    ports:
      - "5027:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    volumes:
      - db-data:/app

  frontend:
    build:
      context: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  db-data:
